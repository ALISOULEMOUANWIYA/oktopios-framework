name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oktopios-framework
        uses: actions/checkout@v4

      # Dépendances depuis les sources (langage + ORM) — indépendant de PyPI.
      - name: Checkout oktopios (langage)
        uses: actions/checkout@v4
        with:
          repository: ALISOULEMOUANWIYA/oktopios
          path: .oktopios-lang

      - name: Checkout oktopios-orm
        uses: actions/checkout@v4
        with:
          repository: ALISOULEMOUANWIYA/oktopios-orm
          path: .oktopios-orm

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer toute la pile + pytest
        run: |
          python -m pip install --upgrade pip
          pip install ./.oktopios-lang
          pip install ./.oktopios-orm
          pip install .
          pip install pytest

      - name: Lancer les tests e2e (blog complet)
        run: pytest -q
